<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Wireframe of the planned ChargePlan screen: a short intro, inputs on the left, and on the right a one-line verdict, the night board of charging blocks, and a table of the same numbers">
  <title>ChargePlan wireframe (proposed design)</title>
  <style>
    text { font-family: Barlow, Arial, Helvetica, sans-serif; fill: #121820; }
    .cond { font-family: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif; }
    .muted, .muted text { fill: #566069; }
    .h { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; }
    .val { font-size: 15px; }
    .input { fill: #ffffff; stroke: #d3d8dd; }
    .rule { stroke: #d3d8dd; stroke-width: 1; }
    .charge { fill: #b8730c; }
    .shade { fill: #e6eaee; }
    .link { font-size: 14px; text-decoration: underline; }
  </style>

  <rect width="1200" height="860" fill="#f5f6f7"/>
  <text x="1160" y="34" text-anchor="end" class="label muted">Proposed design (wireframe). Numbers from the engine's run of the example.</text>

  <!-- Intro -->
  <text x="40" y="60" class="cond" style="font-size: 30px; font-weight: 600">ChargePlan</text>
  <text x="40" y="92" style="font-size: 16px">Plan tonight's charging for a small EV fleet. Enter your vans, power limit and electricity rates.</text>
  <text x="40" y="114" style="font-size: 16px">ChargePlan finds the cheapest schedule that gets every van out on time.</text>

  <!-- ============ Inputs ============ -->
  <text x="40" y="172" class="cond h">Night</text>
  <text x="40" y="196" class="label muted">Starts</text>
  <text x="210" y="196" class="label muted">Ends</text>
  <rect x="40" y="202" width="160" height="34" rx="3" class="input"/><text x="50" y="224" class="val">Oct 15, 18:00</text>
  <rect x="210" y="202" width="160" height="34" rx="3" class="input"/><text x="220" y="224" class="val">Oct 16, 08:00</text>
  <text x="40" y="260" class="label muted">Time zone</text>
  <rect x="40" y="266" width="330" height="34" rx="3" class="input"/><text x="50" y="288" class="val">America/New_York</text>

  <text x="40" y="340" class="cond h">Power</text>
  <text x="40" y="364" class="label muted">Limit (kW)</text>
  <text x="210" y="364" class="label muted">Efficiency (%)</text>
  <rect x="40" y="370" width="160" height="34" rx="3" class="input"/><text x="50" y="392" class="val">10</text>
  <rect x="210" y="370" width="160" height="34" rx="3" class="input"/><text x="220" y="392" class="val">90</text>

  <text x="40" y="444" class="cond h">Rates</text>
  <text x="40" y="468" class="label muted">From</text>
  <text x="130" y="468" class="label muted">To</text>
  <text x="220" y="468" class="label muted">$/kWh</text>
  <g class="val">
    <rect x="40" y="474" width="80" height="30" rx="3" class="input"/><text x="50" y="494">18:00</text>
    <rect x="130" y="474" width="80" height="30" rx="3" class="input"/><text x="140" y="494">00:00</text>
    <rect x="220" y="474" width="80" height="30" rx="3" class="input"/><text x="230" y="494">0.30</text>
    <rect x="40" y="510" width="80" height="30" rx="3" class="input"/><text x="50" y="530">00:00</text>
    <rect x="130" y="510" width="80" height="30" rx="3" class="input"/><text x="140" y="530">06:00</text>
    <rect x="220" y="510" width="80" height="30" rx="3" class="input"/><text x="230" y="530">0.12</text>
    <rect x="40" y="546" width="80" height="30" rx="3" class="input"/><text x="50" y="566">06:00</text>
    <rect x="130" y="546" width="80" height="30" rx="3" class="input"/><text x="140" y="566">08:00</text>
    <rect x="220" y="546" width="80" height="30" rx="3" class="input"/><text x="230" y="566">0.30</text>
  </g>
  <text x="40" y="602" class="link">Add rate</text>

  <text x="40" y="650" class="cond h">Vans</text>
  <text x="40" y="674" class="label muted">Van</text>
  <text x="112" y="674" class="label muted">Arrives</text>
  <text x="184" y="674" class="label muted">Leaves</text>
  <text x="256" y="674" class="label muted">kWh</text>
  <text x="316" y="674" class="label muted">kW</text>
  <g class="val">
    <rect x="40" y="680" width="66" height="30" rx="3" class="input"/><text x="48" y="700">Van A</text>
    <rect x="112" y="680" width="66" height="30" rx="3" class="input"/><text x="120" y="700">18:00</text>
    <rect x="184" y="680" width="66" height="30" rx="3" class="input"/><text x="192" y="700">23:00</text>
    <rect x="256" y="680" width="54" height="30" rx="3" class="input"/><text x="264" y="700">18</text>
    <rect x="316" y="680" width="54" height="30" rx="3" class="input"/><text x="324" y="700">10</text>
    <rect x="40" y="716" width="66" height="30" rx="3" class="input"/><text x="48" y="736">Van B</text>
    <rect x="112" y="716" width="66" height="30" rx="3" class="input"/><text x="120" y="736">18:00</text>
    <rect x="184" y="716" width="66" height="30" rx="3" class="input"/><text x="192" y="736">08:00</text>
    <rect x="256" y="716" width="54" height="30" rx="3" class="input"/><text x="264" y="736">18</text>
    <rect x="316" y="716" width="54" height="30" rx="3" class="input"/><text x="324" y="736">10</text>
  </g>
  <text x="40" y="772" class="link">Add van</text>

  <rect x="40" y="796" width="140" height="40" rx="3" fill="#121820"/>
  <text x="110" y="821" text-anchor="middle" style="font-size: 15px; font-weight: 600; fill: #ffffff">Plan tonight</text>
  <text x="200" y="821" class="link">Reset example</text>

  <!-- ============ Result ============ -->
  <text x="430" y="172" class="label muted">Example plan</text>
  <text x="430" y="216" class="cond" style="font-size: 36px; font-weight: 600">Both vans ready for $8.40.</text>
  <text x="430" y="246" class="muted" style="font-size: 16px">$3.60 less than charging as soon as they arrive.</text>

  <!-- Night board: 28 half-hour columns from x=510 to x=1160 (23.21 px each) -->
  <g class="label muted">
    <text x="516" y="276">$0.30/kWh</text>
    <text x="795" y="276">$0.12/kWh</text>
    <text x="1073" y="276">$0.30</text>
  </g>
  <g class="label muted cond">
    <text x="510" y="294" text-anchor="middle">18:00</text>
    <text x="602.9" y="294" text-anchor="middle">20:00</text>
    <text x="695.7" y="294" text-anchor="middle">22:00</text>
    <text x="788.6" y="294" text-anchor="middle">00:00</text>
    <text x="881.4" y="294" text-anchor="middle">02:00</text>
    <text x="974.3" y="294" text-anchor="middle">04:00</text>
    <text x="1067.1" y="294" text-anchor="middle">06:00</text>
    <text x="1160" y="294" text-anchor="end">08:00</text>
  </g>
  <rect x="510" y="302" width="650" height="156" fill="#ffffff"/>
  <rect x="510" y="302" width="278.6" height="156" class="shade"/>
  <rect x="1067.1" y="302" width="92.9" height="156" class="shade"/>

  <text x="430" y="331" style="font-size: 14px">Van A</text>
  <text x="430" y="377" style="font-size: 14px">Van B</text>
  <text x="430" y="424" style="font-size: 14px" class="muted">Site</text>
  <text x="430" y="442" class="label muted">limit 10 kW</text>

  <!-- Van A: charges 21:00-23:00, leaves 23:00 -->
  <g class="charge">
    <rect x="650.3" y="312" width="21.2" height="30"/><rect x="673.5" y="312" width="21.2" height="30"/>
    <rect x="696.7" y="312" width="21.2" height="30"/><rect x="719.9" y="312" width="21.2" height="30"/>
  </g>
  <rect x="742.1" y="303" width="417.9" height="46" fill="#f5f6f7" opacity="0.9"/>
  <line x1="742.1" y1="306" x2="742.1" y2="346" stroke="#121820" stroke-width="2"/>
  <text x="750" y="331" class="label muted">left 23:00</text>

  <!-- Van B: charges 04:00-06:00 -->
  <g class="charge">
    <rect x="975.3" y="358" width="21.2" height="30"/><rect x="998.5" y="358" width="21.2" height="30"/>
    <rect x="1021.7" y="358" width="21.2" height="30"/><rect x="1044.9" y="358" width="21.2" height="30"/>
  </g>

  <!-- Site: total power against the limit -->
  <line x1="510" y1="408" x2="1160" y2="408" stroke="#121820" stroke-width="1" stroke-dasharray="4 3"/>
  <g class="charge" opacity="0.55">
    <rect x="650.3" y="408" width="21.2" height="42"/><rect x="673.5" y="408" width="21.2" height="42"/>
    <rect x="696.7" y="408" width="21.2" height="42"/><rect x="719.9" y="408" width="21.2" height="42"/>
    <rect x="975.3" y="408" width="21.2" height="42"/><rect x="998.5" y="408" width="21.2" height="42"/>
    <rect x="1021.7" y="408" width="21.2" height="42"/><rect x="1044.9" y="408" width="21.2" height="42"/>
  </g>
  <line x1="430" y1="350" x2="1160" y2="350" class="rule"/>
  <line x1="430" y1="396" x2="1160" y2="396" class="rule"/>
  <line x1="430" y1="458" x2="1160" y2="458" class="rule"/>

  <!-- Same numbers as a table -->
  <g class="label muted">
    <text x="430" y="506">Van</text><text x="530" y="506">Leaves</text><text x="640" y="506">Needs</text>
    <text x="750" y="506">Gets</text><text x="860" y="506">Cost</text><text x="960" y="506">Status</text>
  </g>
  <line x1="430" y1="516" x2="1160" y2="516" class="rule"/>
  <g class="val">
    <text x="430" y="542">Van A</text><text x="530" y="542">23:00</text><text x="640" y="542">18.0 kWh</text>
    <text x="750" y="542">18.0 kWh</text><text x="860" y="542">$6.00</text><text x="960" y="542">✓ Ready</text>
    <text x="430" y="578">Van B</text><text x="530" y="578">08:00</text><text x="640" y="578">18.0 kWh</text>
    <text x="750" y="578">18.0 kWh</text><text x="860" y="578">$2.40</text><text x="960" y="578">✓ Ready</text>
  </g>
  <line x1="430" y1="552" x2="1160" y2="552" class="rule"/>
  <line x1="430" y1="588" x2="1160" y2="588" class="rule"/>

  <text x="430" y="630" class="link">Export CSV</text>
  <text x="530" y="630" class="link">Why this plan</text>
  <text x="430" y="680" class="label muted">Energy cost at the rates entered. Doesn't control chargers.</text>
</svg>
